# keymap-drawer labels (the workflow draw-keymap parses config/corne_choc_pro.keymap with this file).
# Host layout: de (XKBLAYOUT=de); the labels show the character a key sends. Hyprland = Omarchy 4.5.0.
parse_config:
  raw_binding_map:
    # ── Letters (QWERTY on the keycaps, German key codes) ──
    "&kp DE_Y": "Y"
    "&kp DE_Z": "Z"

    # ── Base layer: US legends via mod-morphs ──
    "&semi_colon":  {t: ";", s: ":"}
    "&comma_lt":    {t: ",", s: "<"}
    "&dot_gt":      {t: ".", s: ">"}
    "&slash_qmark": {t: "/", s: "?"}

    # ── Dead keys sent with a Space ──
    "&caret_sp": "^"
    "&acute_sp": "´"
    "&grave_sp": "`"

    # ── NUMBER and SYMBOLS layers: German key codes, shown as their character ──
    "&kp DE_UNDER": "_"
    "&kp DE_DEGREE": "°"
    "&kp DE_EXCL": "!"
    "&kp DE_DQT": "\""
    "&kp DE_SECT": "§"
    "&kp DE_DLLR": "$"
    "&kp DE_EURO": "€"
    "&kp DE_LPAR": "("
    "&kp DE_RPAR": ")"
    "&kp DE_LBKT": "["
    "&kp DE_RBKT": "]"
    "&kp DE_LBRC": "{"
    "&kp DE_RBRC": "}"
    "&kp DE_PLUS": "+"
    "&kp DE_ASTRK": "*"
    "&kp DE_TILDE": "~"
    "&kp DE_HASH": "#"
    "&kp DE_EQUAL": "="
    "&kp DE_AT": "@"
    "&kp DE_AMPS": "&"
    "&kp DE_FSLH": "/"
    "&kp DE_BSLH": "\\"
    "&kp DE_PRCNT": "%"
    "&kp DE_SQT": "'"
    "&kp DE_MINUS": "-"
    "&kp DE_PIPE": "|"
    "&kp DE_LT": "<"
    "&kp DE_GT": ">"
    "&kp DE_A_UMLAUT": "ä"
    "&kp DE_O_UMLAUT": "ö"
    "&kp DE_U_UMLAUT": "ü"
    "&kp DE_SHARP_S": "ß"

    # ── TILING layer: Hyprland (Omarchy 4.5.0), Super+1…0 acts on the focused monitor's block ──
    "&kp LG(N1)": "WS 1"
    "&kp LG(N2)": "WS 2"
    "&kp LG(N3)": "WS 3"
    "&kp LG(N4)": "WS 4"
    "&kp LG(N5)": "WS 5"
    "&kp LG(N6)": "WS 6"
    "&kp LG(N7)": "WS 7"
    "&kp LG(N8)": "WS 8"
    "&kp LG(N9)": "WS 9"
    "&kp LG(N0)": "WS 10"
    "&kp LS(LG(N1))": "→WS 1"
    "&kp LS(LG(N2))": "→WS 2"
    "&kp LS(LG(N3))": "→WS 3"
    "&kp LS(LG(N4))": "→WS 4"
    "&kp LS(LG(N5))": "→WS 5"
    "&kp LS(LG(N6))": "→WS 6"
    "&kp LS(LG(N7))": "→WS 7"
    "&kp LS(LG(N8))": "→WS 8"
    "&kp LS(LG(N9))": "→WS 9"
    "&kp LS(LG(N0))": "→WS 10"
    # focus window / swap window / workspace cycling
    "&kp LG(LEFT)":  "◀ focus"
    "&kp LG(DOWN)":  "▼ focus"
    "&kp LG(UP)":    "▲ focus"
    "&kp LG(RIGHT)": "▶ focus"
    "&kp LG(TAB)":   "next WS"
    "&kp LS(LG(LEFT))":  "◀ swap"
    "&kp LS(LG(DOWN))":  "▼ swap"
    "&kp LS(LG(UP))":    "▲ swap"
    "&kp LS(LG(RIGHT))": "▶ swap"
    "&kp LS(LG(TAB))":   "prev WS"
    # monitors
    "&kp LG(LC(LEFT))":         "◀ mon"
    "&kp LG(LC(RIGHT))":        "mon ▶"
    "&kp LG(LC(LS(LEFT)))":     "win→◀"
    "&kp LG(LC(LS(RIGHT)))":    "win→▶"

    # ── Bluetooth ──
    "&bt BT_SEL 0": "BT 0"
    "&bt BT_SEL 1": "BT 1"
    "&bt BT_SEL 2": "BT 2"
    "&bt BT_SEL 3": "BT 3"
    "&bt BT_SEL 4": "BT 4"
    "&bt BT_CLR":   "BT CLR"

    # ── System ──
    "&sys_reset":     "reset"
    "&bootloader":    "boot"
    "&studio_unlock": "Studio"

    # ── Media ──
    "&kp C_BRI_DN": "🔅"
    "&kp C_BRI_UP": "🔆"
    "&kp C_PREV":   "⏮"
    "&kp C_PP":     "⏯"
    "&kp C_NEXT":   "⏭"
    "&kp C_VOL_DN": "🔉"
    "&kp C_VOL_UP": "🔊"
    "&kp C_MUTE":   "🔇"
