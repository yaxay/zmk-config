# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
---
include:
  # Corne Choc Pro: ZMK Studio (snippet and CONFIG_ZMK_STUDIO) only on the left half, the split central; the right half
  # (peripheral) is built without it.
  - board: corne_choc_pro_left
    snippet: studio-rpc-usb-uart
    shield: nice_view
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  # Left half without ZMK Studio, for BIOS / UEFI and boot menus: without the snippet the USB device has no CDC-ACM
  # interface and is a plain HID keyboard (with the boot protocol, CONFIG_ZMK_USB_BOOT). CONFIG_ZMK_STUDIO is also set in
  # the board's defconfig, so it is switched off on the command line. &studio_unlock does nothing in this build.
  # Artifact: nice_view-corne_choc_pro_left-no-studio.uf2 (an own artifact-name has no -zmk suffix).
  - board: corne_choc_pro_left
    shield: nice_view
    cmake-args: -DCONFIG_ZMK_STUDIO=n
    artifact-name: nice_view-corne_choc_pro_left-no-studio
  - board: corne_choc_pro_right
    shield: nice_view

  - board: corne_choc_pro_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: corne_choc_pro_right
    shield: settings_reset

  - board: piantor_pro_bt_left
    snippet: studio-rpc-usb-uart
    shield: nice_view
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: piantor_pro_bt_right
    shield: nice_view
    snippet: studio-rpc-usb-uart

  - board: piantor_pro_bt_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: piantor_pro_bt_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart

  - board: sofle_choc_pro_left
    snippet: studio-rpc-usb-uart
    shield: nice_view_disp
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: sofle_choc_pro_right
    shield: nice_view_disp
    snippet: studio-rpc-usb-uart

  - board: sofle_choc_pro_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: sofle_choc_pro_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart
